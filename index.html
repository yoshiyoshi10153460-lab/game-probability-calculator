<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>ゲーム確率計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:28px 20px 24px;text-align:center}header small{letter-spacing:.16em;opacity:.65}h1{margin:8px 0 6px;font-size:28px}.sub{margin:0;opacity:.75}.wrap{max-width:560px;margin:auto;padding:18px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tab{border:0;border-radius:16px;background:#fff;padding:15px 8px;font-size:15px;box-shadow:0 2px 10px #0000000d}.tab.active{background:#111827;color:#fff}.card{margin-top:16px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 18px #00000012}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:18px}.buttons{display:flex;gap:10px;margin-top:18px}.primary,.reset{flex:1;padding:14px;border:0;border-radius:13px;font-size:16px;font-weight:700}.primary{background:#111827;color:#fff}.reset{background:#e5e7eb}.result{margin-top:18px;padding:18px;border-radius:15px;background:#f3f4f6;text-align:center}.result .num{font-size:30px;font-weight:800}.hint{font-size:12px;color:#6b7280;margin-top:14px;line-height:1.6}.custom textarea{width:100%;min-height:110px;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><small>ORIGINAL TOOL</small><h1>ゲーム確率計算機</h1><p class="sub">ゲームごとの排出確率を、わかりやすく計算。</p></header>
<main class="wrap">
<div class="tabs"><button class="tab active" data-game="puni">👻 ぷにぷに</button><button class="tab" data-game="tsum">🧸 ツムツム</button><button class="tab" data-game="custom">⚙️ カスタム</button></div>
<section class="card" id="normal">
<h2 id="title">ぷにぷに ガシャ確率計算</h2>
<div class="field"><label>目当ての排出率（%）</label><input id="rate" type="number" inputmode="decimal" min="0" max="100" step="any" value="1"></div>
<div class="field"><label>引く回数</label><input id="times" type="number" inputmode="numeric" min="0" step="1" value="100"></div>
<div class="buttons"><button class="primary" id="calc">確率を計算</button><button class="reset" id="reset">リセット</button></div>
<div class="result"><div>1回以上当たる確率</div><div class="num" id="result">63.40%</div></div>
<p class="hint">※各回が独立した試行である場合の計算です。天井・確定枠などは考慮していません。</p>
</section>
<section class="card custom" id="customBox" style="display:none"><h2>カスタム計算</h2><div class="field"><label>確率（%）</label><input id="crate" type="number" inputmode="decimal" value="1"></div><div class="field"><label>試行回数</label><input id="ctimes" type="number" inputmode="numeric" value="100"></div><button class="primary" id="ccalc">計算する</button><div class="result"><div>1回以上成功する確率</div><div class="num" id="cresult">63.40%</div></div></section>
</main><footer>ゲーム確率計算機</footer>
<script>
const $=id=>document.getElementById(id);function calc(rate,times){rate=Number(rate);times=Math.floor(Number(times));if(!Number.isFinite(rate)||!Number.isFinite(times)||rate<0||rate>100||times<0)return null;return 1-Math.pow(1-rate/100,times)}function show(){let x=calc($('rate').value,$('times').value);$('result').textContent=x===null?'入力を確認':(x*100).toFixed(2)+'%'}$('calc').onclick=show;$('reset').onclick=()=>{$('rate').value=1;$('times').value=100;show()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');let g=b.dataset.game;if(g==='custom'){$('normal').style.display='none';$('customBox').style.display='block'}else{$('normal').style.display='block';$('customBox').style.display='none';$('title').textContent=g==='puni'?'ぷにぷに ガシャ確率計算':'ツムツム ガチャ確率計算'}});$('ccalc').onclick=()=>{let x=calc($('crate').value,$('ctimes').value);$('cresult').textContent=x===null?'入力を確認':(x*100).toFixed(2)+'%'};show();
</script></body></html>
